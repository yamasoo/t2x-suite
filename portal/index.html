<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>t2x-suite · 創作管線總覽</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238a3b2e'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='%23fffdf8' font-family='serif' font-weight='700'>集</text></svg>">
  <style>
    /* 沿用 Novel Studio / T2VN 共用的 fekit 紙張書卷色系 tokens */
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --bg-elev: #fffdf8;
      --bg-sunken: #ede7da;
      --fg: #2b2620;
      --fg-muted: #6e655a;
      --fg-faint: #9a9084;
      --line: #ddd4c4;
      --line-strong: #c4b8a3;

      /* NS 主色：印章朱紅 */
      --accent: #8a3b2e;
      --accent-hover: #722f24;
      --accent-soft: #f1dfd9;
      --on-accent: #fffdf8;

      /* T2VN 主色：靛藍；T2C 主色：松綠 */
      --info: #2f5a7a;
      --info-soft: #d9e6ef;
      --ok: #3f6b3a;
      --ok-soft: #dfeadb;
      --warn: #8a6410;
      --warn-soft: #f3e8c8;
      --err: #a02a2a;
      --err-soft: #f4d9d6;

      --shadow-1: 0 1px 2px rgba(60, 40, 20, 0.08);
      --shadow-2: 0 6px 20px rgba(60, 40, 20, 0.10);
      --font-sans: "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      --font-serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
      --font-mono: ui-monospace, "Cascadia Mono", Consolas, "Noto Sans Mono CJK TC", monospace;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1c1915;
        --bg-elev: #26221c;
        --bg-sunken: #15130f;
        --fg: #ece5d8;
        --fg-muted: #b0a696;
        --fg-faint: #857b6d;
        --line: #3a342b;
        --line-strong: #52493c;

        --accent: #d9826f;
        --accent-hover: #e89886;
        --accent-soft: #3d2620;
        --on-accent: #1c1915;

        --info: #86b6d8;
        --info-soft: #1c2c38;
        --ok: #8fc287;
        --ok-soft: #223020;
        --warn: #e0b95c;
        --warn-soft: #382d12;
        --err: #ee8d86;
        --err-soft: #3d1f1d;

        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1915;
      --bg-elev: #26221c;
      --bg-sunken: #15130f;
      --fg: #ece5d8;
      --fg-muted: #b0a696;
      --fg-faint: #857b6d;
      --line: #3a342b;
      --line-strong: #52493c;

      --accent: #d9826f;
      --accent-hover: #e89886;
      --accent-soft: #3d2620;
      --on-accent: #1c1915;

      --info: #86b6d8;
      --info-soft: #1c2c38;
      --ok: #8fc287;
      --ok-soft: #223020;
      --warn: #e0b95c;
      --warn-soft: #382d12;
      --err: #ee8d86;
      --err-soft: #3d1f1d;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--fg);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* 頂列：比照 fekit shell topbar */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow-1);
    }
    .topbar-inner {
      max-width: 1220px; margin: 0 auto; padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--fg); text-decoration: none;
    }
    .brand:hover { text-decoration: none; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: var(--on-accent);
      font-family: var(--font-serif); font-weight: 700; font-size: 15px;
      box-shadow: var(--shadow-1);
    }
    .brand-title { font-family: var(--font-serif); font-size: 17px; font-weight: 700; letter-spacing: 0.4px; }
    .brand-sub { color: var(--fg-muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .wrap { max-width: 1220px; margin: 0 auto; padding: 22px 24px 56px; }

    /* 按鈕與膠囊：沿用 fekit 手感 */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev); color: var(--fg);
      text-decoration: none; cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .btn:hover { border-color: var(--fg-muted); text-decoration: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .btn.sm { padding: 3px 9px; font-size: 12.5px; }

    /* 套件識別徽章（NS / T2VN / T2C） */
    .kit {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px; border-radius: 999px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.3px; vertical-align: middle;
    }
    .kit-ns { background: var(--accent-soft); color: var(--accent); }
    .kit-t2vn { background: var(--info-soft); color: var(--info); }
    .kit-t2c { background: var(--ok-soft); color: var(--ok); }
    .kit-comfy { background: var(--warn-soft); color: var(--warn); }

    .btn-ns { border-color: var(--accent-soft); color: var(--accent); }
    .btn-ns:hover { background: var(--accent-soft); border-color: var(--accent); }
    .btn-t2vn { border-color: var(--info-soft); color: var(--info); }
    .btn-t2vn:hover { background: var(--info-soft); border-color: var(--info); }
    .btn-t2c { border-color: var(--ok-soft); color: var(--ok); }
    .btn-t2c:hover { background: var(--ok-soft); border-color: var(--ok); }

    /* 步驟管線卡（明確呈現 Step 1 NS → Step 2 T2VN → Step 3 T2C） */
    .pipeline {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 18px;
    }
    .step-card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-top: 3px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-1);
      display: flex; flex-direction: column; gap: 8px;
    }
    .step-card.ns { border-top-color: var(--accent); }
    .step-card.t2vn { border-top-color: var(--info); }
    .step-card.t2c { border-top-color: var(--ok); }
    .step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .step-no { font-size: 12px; color: var(--fg-muted); font-weight: 600; }
    .step-title { font-family: var(--font-serif); font-size: 16px; font-weight: 700; margin: 0; }
    .step-desc { font-size: 12.5px; color: var(--fg-muted); margin: 0; flex: 1; }
    .step-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 6px; border-top: 1px dashed var(--line); }
    .step-arrow {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--fg-faint); font-size: 18px; padding: 0 2px; user-select: none;
    }
    .step-arrow small { font-size: 11px; white-space: nowrap; }
    @media (max-width: 960px) {
      .pipeline { grid-template-columns: 1fr; }
      .step-arrow { flex-direction: row; gap: 6px; padding: 2px 0; }
      .step-arrow span { transform: rotate(90deg); display: inline-block; }
    }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--fg-muted);
      padding: 2px 8px; border-radius: 999px; background: var(--bg-sunken);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--err); }
    .dot.ok { background: var(--ok); }
    .dot.off { background: var(--fg-faint); }

    /* 篩選工具列 */
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 12px;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input[type="search"] {
      width: 260px; max-width: 100%;
      padding: 6px 11px; border-radius: var(--radius);
      border: 1px solid var(--line-strong);
      background: var(--bg-elev); color: var(--fg); font-size: 13.5px;
    }
    input[type="search"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    /* 作品總表卡片 */
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-1);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 820px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    thead th {
      background: var(--bg-sunken);
      font-size: 12px; color: var(--fg-muted); font-weight: 700;
      letter-spacing: 0.3px;
    }
    th .th-wrap { display: inline-flex; align-items: center; gap: 6px; }
    tbody tr:hover td { background: rgba(138, 59, 46, 0.03); }
    tbody tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      font-size: 11px; font-weight: 600; margin-left: 6px;
      background: var(--bg-sunken); color: var(--fg-muted);
    }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .muted { color: var(--fg-muted); font-size: 12px; }
    .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-faint); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; background: var(--info); }
    .empty { padding: 36px 20px; text-align: center; color: var(--fg-muted); }

    /* 頁尾：GitHub 專案導覽與安全說明 */
    .footer {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; font-size: 12.5px; color: var(--fg-muted);
    }
    .gh-links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .gh-links a { color: var(--fg-muted); font-weight: 500; }
    .gh-links a:hover { color: var(--accent); }

    /* 配色模板選擇器彈窗 */
    .swatch-dots { display: inline-flex; align-items: center; gap: 3px; }
    .swatch-dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(128,128,128,0.35); }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(20, 16, 12, 0.52);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal-panel {
      width: min(860px, 100%); max-height: 88vh; overflow-y: auto;
      background: var(--bg-elev); border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-2);
      padding: 18px 20px 20px;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-family: var(--font-serif); font-size: 18px; }
    .theme-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px; margin-top: 12px;
    }
    .theme-card {
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
      background: var(--bg); cursor: pointer; text-align: left; padding: 0;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      display: flex; flex-direction: column; color: var(--fg);
    }
    .theme-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-1); }
    .theme-card.selected { border: 2px solid var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .theme-strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; height: 34px; width: 100%; }
    .theme-meta { padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .theme-meta-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .theme-meta strong { font-size: 13.5px; }
    .theme-sub { font-size: 11.5px; color: var(--fg-muted); line-height: 1.4; }
    .custom-box {
      margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line);
    }
    .custom-box summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--fg); }
    .custom-form {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; margin-top: 12px; align-items: end;
    }
    .custom-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-muted); }
    .custom-form input[type="text"], .custom-form select {
      padding: 6px 9px; border-radius: var(--radius);
      border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font-size: 13px;
    }
    .custom-form input[type="color"] {
      width: 100%; height: 32px; padding: 2px; border-radius: var(--radius);
      border: 1px solid var(--line-strong); background: var(--bg); cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">集</span>
        <span>
          <span class="brand-title">t2x-suite 創作管線總覽</span>
          <span class="brand-sub"> · Novel Studio → T2VN → T2C</span>
        </span>
      </a>
      <div class="top-actions">
        <span id="comfy-pill" class="status-pill"></span>
        <a class="btn sm" href="https://github.com/yamasoo/t2x-suite" target="_blank" rel="noopener">GitHub ↗</a>
        <button id="theme-btn" class="btn sm" type="button" title="選擇或紀錄配色模板">配色模板</button>
        <button id="refresh-btn" class="btn sm primary" type="button">重新整理</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <section id="pipeline" class="pipeline" aria-label="創作步驟與對應套件"></section>

    <div class="toolbar">
      <div class="toolbar-left">
        <input id="filter-q" type="search" placeholder="搜尋作品名稱或 ID…" />
        <button class="btn sm active" data-mode="all" type="button">全部作品</button>
        <button class="btn sm" data-mode="adapted" type="button">已進改編（T2VN / T2C）</button>
        <button class="btn sm" data-mode="unimported" type="button">僅在寫作端（NS）</button>
      </div>
      <div class="toolbar-right">
        <span id="summary-count" class="muted"></span>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>作品</th>
            <th><span class="th-wrap"><span class="kit kit-ns">NS</span> ① 寫作與視覺卡</span></th>
            <th><span class="th-wrap"><span class="kit kit-t2vn">T2VN</span> ② 視覺小說改編</span></th>
            <th><span class="th-wrap"><span class="kit kit-t2c">T2C</span> ③ 頁漫改編</span></th>
            <th>快速前往</th>
          </tr>
        </thead>
        <tbody id="books-body">
          <tr><td colspan="5" class="empty">載入中…</td></tr>
        </tbody>
      </table>
    </div>

    <footer class="footer">
      <div class="gh-links">
        <span>GitHub 專案：</span>
        <a href="https://github.com/yamasoo/t2x-suite" target="_blank" rel="noopener">t2x-suite ↗</a>
        <a href="https://github.com/yamasoo/novel-studio" target="_blank" rel="noopener">Novel Studio (NS) ↗</a>
        <a href="https://github.com/yamasoo/text_2_visual_novel" target="_blank" rel="noopener">T2VN ↗</a>
        <a href="https://github.com/yamasoo/text2comics" target="_blank" rel="noopener">T2C (text2comics) ↗</a>
      </div>
      <div>唯讀總覽（僅綁 127.0.0.1）· 各專案仍可完全獨立開發與啟動</div>
    </footer>
  </div>

  <div id="theme-modal" class="modal-backdrop" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="配色模板事典">
      <div class="modal-head">
        <div>
          <h2>配色模板事典</h2>
          <div class="muted">收錄 fekit 書卷色系與和田三造《配色總鑑》經典色組，亦可自訂並紀錄專屬模板</div>
        </div>
        <button id="theme-close" class="btn sm" type="button">關閉</button>
      </div>
      <div class="toolbar" style="margin-bottom:4px">
        <div class="toolbar-left" id="theme-filters">
          <button class="btn sm active" data-tf="all" type="button">全部</button>
          <button class="btn sm" data-tf="light" type="button">淺色</button>
          <button class="btn sm" data-tf="dark" type="button">深色</button>
          <button class="btn sm" data-tf="custom" type="button">我的自訂</button>
        </div>
        <div class="toolbar-right">
          <button id="theme-export" class="btn sm" type="button" title="下載目前所有自訂模板 JSON">匯出自訂 JSON</button>
        </div>
      </div>
      <div id="theme-grid" class="theme-grid"></div>
      <details class="custom-box">
        <summary>＋ 自訂並紀錄新配色模板</summary>
        <form id="custom-theme-form" class="custom-form">
          <label>模板名稱<input id="ct-name" type="text" placeholder="例如：暮秋銀杏" required /></label>
          <label>明暗基底
            <select id="ct-scheme">
              <option value="light">淺色（紙張系）</option>
              <option value="dark">深色（夜墨系）</option>
            </select>
          </label>
          <label>底色<input id="ct-bg" type="color" value="#f5f1e6" /></label>
          <label>NS 主色<input id="ct-accent" type="color" value="#8e354a" /></label>
          <label>T2VN 主色<input id="ct-info" type="color" value="#336e7b" /></label>
          <label>T2C 主色<input id="ct-ok" type="color" value="#3b6e52" /></label>
          <button class="btn sm primary" type="submit">儲存並套用</button>
        </form>
      </details>
    </div>
  </div>

  <script>
    "use strict";

    const GH = {
      suite: "https://github.com/yamasoo/t2x-suite",
      ns: "https://github.com/yamasoo/novel-studio",
      t2vn: "https://github.com/yamasoo/text_2_visual_novel",
      t2c: "https://github.com/yamasoo/text2comics",
    };

    function el(tag, attrs, ...children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v === null || v === undefined || v === false) continue;
          if (k.startsWith("on") && typeof v === "function") node[k] = v;
          else if (k === "class") node.className = v;
          else node.setAttribute(k, v === true ? "" : String(v));
        }
      }
      for (const ch of children.flat()) {
        if (ch === null || ch === undefined || ch === false) continue;
        node.append(typeof ch === "string" ? document.createTextNode(ch) : ch);
      }
      return node;
    }

    const enc = encodeURIComponent;
    let state = { data: null, mode: "all", q: "" };

    /* 色彩混合工具（供自訂模板自動推導柔色與邊框） */
    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
      if (!m) return [128, 128, 128];
      const v = parseInt(m[1], 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    function mixHex(a, b, ratio) {
      const [r1, g1, b1] = hexToRgb(a);
      const [r2, g2, b2] = hexToRgb(b);
      const p = Math.max(0, Math.min(1, ratio));
      const toH = (x) => Math.round(x).toString(16).padStart(2, "0");
      return "#" + toH(r1 + (r2 - r1) * p) + toH(g1 + (g2 - g1) * p) + toH(b1 + (b2 - b1) * p);
    }
    function buildCustomTheme(name, scheme, bg, accent, info, ok) {
      const isDark = scheme === "dark";
      const target = isDark ? "#ffffff" : "#1c1814";
      const softRatio = isDark ? 0.80 : 0.84;
      const tokens = {
        bg,
        "bg-elev": mixHex(bg, isDark ? "#ffffff" : "#ffffff", isDark ? 0.06 : 0.72),
        "bg-sunken": mixHex(bg, "#000000", isDark ? 0.24 : 0.05),
        fg: isDark ? "#ece7df" : "#28231e",
        "fg-muted": mixHex(bg, target, 0.62),
        "fg-faint": mixHex(bg, target, 0.44),
        line: mixHex(bg, target, 0.14),
        "line-strong": mixHex(bg, target, 0.25),
        accent,
        "accent-hover": mixHex(accent, isDark ? "#ffffff" : "#000000", 0.16),
        "accent-soft": mixHex(accent, bg, softRatio),
        "on-accent": isDark ? bg : "#fffdf8",
        info,
        "info-soft": mixHex(info, bg, softRatio),
        ok,
        "ok-soft": mixHex(ok, bg, softRatio),
        warn: isDark ? "#e0b95c" : "#8a6410",
        "warn-soft": mixHex(isDark ? "#e0b95c" : "#8a6410", bg, softRatio),
        err: isDark ? "#ee8d86" : "#a02a2a",
        "err-soft": mixHex(isDark ? "#ee8d86" : "#a02a2a", bg, softRatio),
      };
      return {
        id: "custom-" + Date.now().toString(36),
        name: name.trim(),
        subtitle: `自訂模板 · ${isDark ? "深色" : "淺色"}`,
        scheme,
        source: "custom",
        swatches: [bg, accent, info, ok],
        tokens,
      };
    }

    let themeState = { builtins: [], customs: [], currentId: "", filter: "all" };

    function loadCustomThemes() {
      try {
        const raw = JSON.parse(localStorage.getItem("t2x.custom_themes") || "[]");
        return Array.isArray(raw) ? raw.filter((t) => t && t.id && t.tokens) : [];
      } catch (_) { return []; }
    }
    function saveCustomThemes(list) {
      localStorage.setItem("t2x.custom_themes", JSON.stringify(list));
    }
    function allThemes() {
      return [...themeState.builtins, ...themeState.customs];
    }

    function applyTheme(theme) {
      if (!theme || !theme.tokens) return;
      const root = document.documentElement;
      root.setAttribute("data-theme", theme.scheme === "dark" ? "dark" : "light");
      for (const [k, v] of Object.entries(theme.tokens)) {
        root.style.setProperty(`--${k}`, v);
      }
      themeState.currentId = theme.id;
      localStorage.setItem("t2x.theme_id", theme.id);
      const btn = document.getElementById("theme-btn");
      const dots = el("span", { class: "swatch-dots" },
        (theme.swatches || []).slice(1, 4).map((c) => el("i", { style: `background:${c}` })));
      btn.replaceChildren(dots, el("span", {}, `配色：${theme.name}`));
      const fav = document.getElementById("favicon");
      if (fav && theme.tokens.accent) {
        const bgHex = encodeURIComponent(theme.tokens.accent);
        const fgHex = encodeURIComponent(theme.tokens["on-accent"] || "#fffdf8");
        fav.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='${bgHex}'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='${fgHex}' font-family='serif' font-weight='700'>集</text></svg>`;
      }
    }

    function renderThemeGrid() {
      const grid = document.getElementById("theme-grid");
      const items = allThemes().filter((t) => {
        if (themeState.filter === "light") return t.scheme !== "dark";
        if (themeState.filter === "dark") return t.scheme === "dark";
        if (themeState.filter === "custom") return t.source === "custom";
        return true;
      });
      if (!items.length) {
        grid.replaceChildren(el("div", { class: "muted", style: "padding:14px 2px" }, "尚無符合條件的模板。"));
        return;
      }
      grid.replaceChildren(...items.map((t) => {
        const strip = el("div", { class: "theme-strip" },
          (t.swatches || [t.tokens.bg, t.tokens.accent, t.tokens.info, t.tokens.ok]).map((c) =>
            el("span", { style: `background:${c}` })
          ));
        const delBtn = t.source === "custom"
          ? el("button", {
              class: "btn sm",
              type: "button",
              title: "刪除此自訂模板",
              onclick: (ev) => {
                ev.stopPropagation();
                themeState.customs = themeState.customs.filter((x) => x.id !== t.id);
                saveCustomThemes(themeState.customs);
                if (themeState.currentId === t.id && themeState.builtins.length) {
                  applyTheme(themeState.builtins[0]);
                }
                renderThemeGrid();
              },
            }, "刪除")
          : null;
        return el("div", {
          class: "theme-card" + (t.id === themeState.currentId ? " selected" : ""),
          role: "button",
          tabindex: "0",
          onclick: () => { applyTheme(t); renderThemeGrid(); },
          onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); applyTheme(t); renderThemeGrid(); } },
        },
          strip,
          el("div", { class: "theme-meta" },
            el("div", { class: "theme-meta-top" },
              el("strong", {}, t.name),
              el("span", { class: "badge" }, t.scheme === "dark" ? "深色" : "淺色")
            ),
            el("div", { class: "theme-sub" }, t.subtitle || ""),
            delBtn ? el("div", { style: "margin-top:4px" }, delBtn) : null
          ));
      }));
    }

    async function initTheme() {
      themeState.customs = loadCustomThemes();
      try {
        const res = await fetch("/api/themes", { cache: "no-store" });
        const list = await res.json();
        if (Array.isArray(list)) themeState.builtins = list;
      } catch (_) { themeState.builtins = []; }

      const savedId = localStorage.getItem("t2x.theme_id");
      const preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const picked = allThemes().find((t) => t.id === savedId)
        || themeState.builtins.find((t) => t.id === (preferDark ? "fekit-ink" : "fekit-paper"))
        || themeState.builtins[0];
      if (picked) applyTheme(picked);

      const modal = document.getElementById("theme-modal");
      document.getElementById("theme-btn").onclick = () => { renderThemeGrid(); modal.hidden = false; };
      document.getElementById("theme-close").onclick = () => { modal.hidden = true; };
      modal.onclick = (ev) => { if (ev.target === modal) modal.hidden = true; };
      document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !modal.hidden) modal.hidden = true; });

      for (const b of document.querySelectorAll("[data-tf]")) {
        b.onclick = () => {
          themeState.filter = b.getAttribute("data-tf");
          for (const o of document.querySelectorAll("[data-tf]")) o.classList.toggle("active", o === b);
          renderThemeGrid();
        };
      }

      const schemeSel = document.getElementById("ct-scheme");
      schemeSel.onchange = () => {
        document.getElementById("ct-bg").value = schemeSel.value === "dark" ? "#1b222c" : "#f5f1e6";
      };
      document.getElementById("custom-theme-form").onsubmit = (ev) => {
        ev.preventDefault();
        const name = document.getElementById("ct-name").value.trim();
        if (!name) return;
        const t = buildCustomTheme(
          name,
          schemeSel.value,
          document.getElementById("ct-bg").value,
          document.getElementById("ct-accent").value,
          document.getElementById("ct-info").value,
          document.getElementById("ct-ok").value
        );
        themeState.customs.push(t);
        saveCustomThemes(themeState.customs);
        applyTheme(t);
        document.getElementById("ct-name").value = "";
        renderThemeGrid();
      };

      document.getElementById("theme-export").onclick = () => {
        const blob = new Blob([JSON.stringify(themeState.customs, null, 2)], { type: "application/json" });
        const a = el("a", { href: URL.createObjectURL(blob), download: "t2x-custom-themes.json" });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
    }

    function statusPill(label, info) {
      const hasUrl = Boolean(info && info.url);
      const online = Boolean(info && info.online);
      const dotCls = !hasUrl ? "dot off" : (online ? "dot ok" : "dot");
      const ver = info && info.version ? ` v${info.version}` : "";
      const txt = !hasUrl ? "未設定" : (online ? "在線" : "離線");
      return el("span", { class: "status-pill" }, el("span", { class: dotCls }), `${label}${ver} · ${txt}`);
    }

    function renderPipeline(svcs) {
      const ns = svcs.novel_studio || {};
      const t2 = svcs.t2vn || {};
      const comfy = svcs.comfyui || {};

      // 頂列 ComfyUI 狀態膠囊
      const comfyPill = document.getElementById("comfy-pill");
      const comfyDot = !comfy.url ? "dot off" : (comfy.online ? "dot ok" : "dot");
      comfyPill.replaceChildren(
        el("span", { class: comfyDot }),
        el("span", { class: "kit kit-comfy" }, "ComfyUI"),
        el("span", {}, !comfy.url ? "未設定" : (comfy.online ? "在線" : "離線"))
      );

      const step1 = el("article", { class: "step-card ns" },
        el("div", { class: "step-head" },
          el("span", { class: "step-no" }, "步驟 ① · 上游正本"),
          el("span", { class: "kit kit-ns" }, "NS · Novel Studio")
        ),
        el("h2", { class: "step-title" }, "寫作、設定集與角色視覺卡"),
        el("p", { class: "step-desc" }, "開書、排綱、寫稿（候選隔離）、反推補設定，並產出相容 VN 與頁漫的結構化視覺卡。"),
        el("div", { class: "step-foot" },
          statusPill("服務", ns),
          el("div", { class: "actions" },
            el("a", { class: "btn sm", href: GH.ns, target: "_blank", rel: "noopener" }, "GitHub ↗"),
            ns.url ? el("a", { class: "btn sm btn-ns", href: ns.url + "/", target: "novel_studio", rel: "noopener" }, "開啟 NS ↗") : null
          )
        )
      );

      const arrow1 = el("div", { class: "step-arrow" }, el("span", {}, "→"), el("small", {}, "唯讀同步"));

      const step2 = el("article", { class: "step-card t2vn" },
        el("div", { class: "step-head" },
          el("span", { class: "step-no" }, "步驟 ② · 視覺小說"),
          el("span", { class: "kit kit-t2vn" }, "T2VN")
        ),
        el("h2", { class: "step-title" }, "劇本標註、立繪語音與 Ren'Py"),
        el("p", { class: "step-desc" }, "從書庫唯讀匯入正文與視覺卡，逐句校對對白、生成立繪／配樂／語音，輸出可遊玩專案。"),
        el("div", { class: "step-foot" },
          statusPill("服務", t2),
          el("div", { class: "actions" },
            el("a", { class: "btn sm", href: GH.t2vn, target: "_blank", rel: "noopener" }, "GitHub ↗"),
            t2.url ? el("a", { class: "btn sm btn-t2vn", href: t2.url + "/", target: "t2vn_studio", rel: "noopener" }, "開啟 T2VN ↗") : null
          )
        )
      );

      const arrow2 = el("div", { class: "step-arrow" }, el("span", {}, "→"), el("small", {}, "外觀卡共用"));

      const step3 = el("article", { class: "step-card t2c" },
        el("div", { class: "step-head" },
          el("span", { class: "step-no" }, "步驟 ③ · 日式頁漫"),
          el("span", { class: "kit kit-t2c" }, "T2C · 內嵌於 T2VN")
        ),
        el("h2", { class: "step-title" }, "分鏡、出圖、嵌字與 PDF / CBZ"),
        el("p", { class: "step-desc" }, "與 T2VN 共用同一份外觀卡與 ComfyUI profile，逐頁分鏡出圖、微調對話框並輸出右翻漫畫。"),
        el("div", { class: "step-foot" },
          statusPill("引擎", { url: t2.url, online: t2.online }),
          el("div", { class: "actions" },
            el("a", { class: "btn sm", href: GH.t2c, target: "_blank", rel: "noopener" }, "GitHub ↗"),
            t2.url ? el("a", { class: "btn sm btn-t2c", href: t2.url + "/", target: "t2vn_studio", rel: "noopener" }, "前往 T2C ↗") : null
          )
        )
      );

      document.getElementById("pipeline").replaceChildren(step1, arrow1, step2, arrow2, step3);
    }

    function renderBooks() {
      const tbody = document.getElementById("books-body");
      if (!state.data) return;
      const svcs = state.data.services || {};
      const nsUrl = (svcs.novel_studio && svcs.novel_studio.url) || "";
      const t2Url = (svcs.t2vn && svcs.t2vn.url) || "";
      const q = state.q.trim().toLowerCase();

      const all = state.data.books || [];
      const rows = all.filter((b) => {
        if (state.mode === "adapted" && !(b.t2vn && b.t2vn.imported)) return false;
        if (state.mode === "unimported" && (b.t2vn && b.t2vn.imported)) return false;
        if (q) {
          const hay = `${b.title} ${b.key} ${(b.t2vn && b.t2vn.book_id) || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("summary-count").textContent = `顯示 ${rows.length} / 共 ${all.length} 部作品`;

      if (!rows.length) {
        tbody.replaceChildren(el("tr", {}, el("td", { colspan: 5, class: "empty" }, "目前沒有符合條件的作品。")));
        return;
      }

      tbody.replaceChildren(...rows.map((b) => {
        const titleCell = el("td", {},
          el("div", {},
            el("strong", {}, b.title),
            el("span", { class: "badge" }, b.lang || "zh-TW"),
            b.needs_migration ? el("span", { class: "badge warn" }, "待轉 v3") : null
          ),
          el("div", { class: "mono" }, b.t2vn && b.t2vn.book_id && b.t2vn.book_id !== b.key
            ? `${b.key} → ${b.t2vn.book_id}` : b.key)
        );

        let nsCell;
        if (b.ns) {
          const cand = b.ns.pending_candidates ? ` · 候選 ${b.ns.pending_candidates}` : "";
          nsCell = el("td", {},
            el("div", {}, `已寫 ${b.ns.chapters_written} 章` + (b.ns.chapters_planned ? ` / 排綱 ${b.ns.chapters_planned}` : "")),
            el("div", { class: "muted" }, `${Number(b.ns.chars || 0).toLocaleString()} ${b.ns.unit || "字"}${cand}`)
          );
        } else {
          nsCell = el("td", { class: "muted" }, "外部匯入／未在書庫");
        }

        let t2Cell;
        if (b.t2vn && b.t2vn.imported) {
          const pct = b.t2vn.chapters ? Math.round((100 * b.t2vn.reviewed) / b.t2vn.chapters) : 0;
          t2Cell = el("td", {},
            el("div", {}, `${b.t2vn.chapters} 章 · 標註 ${b.t2vn.annotated} · 校對 ${b.t2vn.reviewed}`),
            el("div", { class: "bar" }, el("i", { style: `width:${pct}%` }))
          );
        } else {
          const vc = b.ns && b.ns.visual_cards ? `（視覺卡 ${b.ns.visual_cards} 張就緒）` : "";
          t2Cell = el("td", { class: "muted" }, `尚未匯入${vc}`);
        }

        const comicCount = (b.comic && b.comic.count) || 0;
        const comicCell = comicCount
          ? el("td", {},
              el("div", {}, `${comicCount} 個專案`),
              el("div", { class: "muted" }, (b.comic.projects || []).map((p) => p.title || p.project_id).slice(0, 2).join("、"))
            )
          : el("td", { class: "muted" }, "—");

        const acts = [];
        if (b.ns && nsUrl) {
          acts.push(el("a", { class: "btn sm btn-ns", href: `${nsUrl}/#/b/${enc(b.ns.id)}`, target: "novel_studio", rel: "noopener" }, "NS 寫作 ↗"));
          acts.push(el("a", { class: "btn sm btn-ns", href: `${nsUrl}/#/b/${enc(b.ns.id)}/bible`, target: "novel_studio", rel: "noopener" }, "NS 視覺卡 ↗"));
        }
        if (b.t2vn && b.t2vn.imported && t2Url) {
          const bid = enc(b.t2vn.book_id);
          acts.push(el("a", { class: "btn sm btn-t2vn", href: `${t2Url}/#/book/${bid}`, target: "t2vn_studio", rel: "noopener" }, "T2VN 校對 ↗"));
          acts.push(el("a", { class: "btn sm btn-t2vn", href: `${t2Url}/#/book/${bid}/assets`, target: "t2vn_studio", rel: "noopener" }, "T2VN 外觀 ↗"));
          acts.push(el("a", { class: "btn sm btn-t2c", href: `${t2Url}/#/book/${bid}/comic`, target: "t2vn_studio", rel: "noopener" }, "T2C 漫畫 ↗"));
        } else if (b.ns && t2Url) {
          acts.push(el("a", { class: "btn sm primary", href: `${t2Url}/#/?source=${enc(b.ns.id)}`, target: "t2vn_studio", rel: "noopener" }, "匯入 T2VN ↗"));
        }

        return el("tr", {}, titleCell, nsCell, t2Cell, comicCell, el("td", {}, el("div", { class: "actions" }, ...acts)));
      }));
    }

    async function load() {
      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      try {
        const res = await fetch("/api/overview", { cache: "no-store" });
        state.data = await res.json();
        renderPipeline(state.data.services || {});
        renderBooks();
      } catch (err) {
        document.getElementById("books-body").replaceChildren(
          el("tr", {}, el("td", { colspan: 5, class: "empty" }, `讀取失敗：${err}`))
        );
      } finally {
        btn.disabled = false;
      }
    }

    initTheme();
    document.getElementById("refresh-btn").onclick = load;
    document.getElementById("filter-q").oninput = (e) => { state.q = e.target.value; renderBooks(); };
    for (const btn of document.querySelectorAll("[data-mode]")) {
      btn.onclick = () => {
        state.mode = btn.getAttribute("data-mode");
        for (const other of document.querySelectorAll("[data-mode]")) {
          other.classList.toggle("active", other === btn);
        }
        renderBooks();
      };
    }

    load();
  </script>
</body>
</html>
